<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title | default: 'k-star privacy policy' | escape }}</title>
    <link rel="icon" type="image/png" href="{{ '/icon.png' | relative_url }}">
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        max-width: 800px;
        margin: 0 auto;
        padding: 32px 24px 64px;
        background: #f5f3ea;
        color: #244c4e;
        font: 17px/1.7 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        overflow-wrap: anywhere;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 16px;
        padding-bottom: 24px;
        margin-bottom: 32px;
        border-bottom: 1px solid #d6ddd1;
      }
      .brand img { width: 72px; height: 72px; border-radius: 18px; }
      .brand span { font-size: 36px; font-weight: 700; letter-spacing: -1px; }
      h1 { font-size: clamp(28px, 5vw, 36px); line-height: 1.2; margin: 0 0 20px; }
      h2 { font-size: 23px; line-height: 1.3; margin: 36px 0 12px; }
      p, ul { margin: 0 0 20px; }
      a { color: #245e5c; text-underline-offset: 3px; }
      a:focus-visible { outline: 3px solid #244c4e; outline-offset: 4px; }
      @media (max-width: 480px) {
        body { padding: 24px 20px 48px; }
        .brand { gap: 12px; margin-bottom: 28px; }
        .brand img { width: 60px; height: 60px; border-radius: 15px; }
        .brand span { font-size: 32px; }
      }
    </style>
  </head>
  <body>
    <header class="brand">
      <img src="{{ '/icon.png' | relative_url }}" width="72" height="72" alt="">
      <span>k-star</span>
    </header>
    <main>{{ content }}</main>
  </body>
</html>
